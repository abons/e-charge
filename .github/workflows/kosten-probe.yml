# Tijdelijk: draait `npm run kosten -- --dry-run` op een runner, omdat de bouwsessie de API niet mag
# bereiken. De uitkomst gaat met de hand in log.md; dit bestand gaat daarna weer weg.
name: kosten-probe
on:
  push:
    branches: [claude/zonneplan-stroomkosten-zichtbaarheid-hiqcez]
jobs:
  kosten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run kosten -- --dry-run
