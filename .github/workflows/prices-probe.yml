# Tijdelijk: bekijkt vanaf een runner hoe EnergyZero antwoordt. Ronde 5: wat de API zelf zegt
# over de invoer, en nog wat namen voor het kwartier.
name: prices-probe
on:
  push:
    branches: [claude/zonneplan-stroomkosten-zichtbaarheid-hiqcez]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          FROM=$(date -u -d 'today 00:00' +%Y-%m-%dT%H:%M:%S.000Z)
          TILL=$(date -u -d 'today 03:00' +%Y-%m-%dT%H:%M:%S.000Z)
          GQL=https://api.energyzero.nl/v1/gql
          q() { echo "=================== $1"; curl -sS -m 20 -o body.txt -w "%{http_code}\n" -H "Content-Type: application/json" -d "$2" "$GQL" || true; head -c 900 body.txt; echo; }
          q "zonder intervalType" "{\"query\":\"query(\$input: EnergyMarketPricesInput!) { energyMarketPrices(input: \$input) { prices { from till energyPriceExcl } } }\",\"variables\":{\"input\":{\"from\":\"$FROM\",\"till\":\"$TILL\",\"type\":\"Electricity\"}}}"
          q "onbekend veld" "{\"query\":\"query(\$input: EnergyMarketPricesInput!) { energyMarketPrices(input: \$input) { prices { from till energyPriceExcl } } }\",\"variables\":{\"input\":{\"from\":\"$FROM\",\"till\":\"$TILL\",\"type\":\"Electricity\",\"intervalType\":\"Hourly\",\"interval\":\"x\",\"resolution\":\"x\",\"granularity\":\"x\"}}}"
          q "leeg intervalType" "{\"query\":\"query(\$input: EnergyMarketPricesInput!) { energyMarketPrices(input: \$input) { prices { from till energyPriceExcl } } }\",\"variables\":{\"input\":{\"from\":\"$FROM\",\"till\":\"$TILL\",\"type\":\"Electricity\",\"intervalType\":\"\"}}}"
          q "letterlijk enum in query" "{\"query\":\"{ energyMarketPrices(input: {from: \\\"$FROM\\\", till: \\\"$TILL\\\", type: Electricity, intervalType: Kwartier}) { prices { from till energyPriceExcl } } }\"}"
          for IV in QuarterOfHour Quarterhour Quarterhourly Minutes15 Minute15 FifteenMinute Min15 PT15M QuarterlyHour HalfHourly Quarters Every15Minutes; do
            q "intervalType=$IV" "{\"query\":\"query(\$input: EnergyMarketPricesInput!) { energyMarketPrices(input: \$input) { prices { from till energyPriceExcl } } }\",\"variables\":{\"input\":{\"from\":\"$FROM\",\"till\":\"$TILL\",\"type\":\"Electricity\",\"intervalType\":\"$IV\"}}}"
          done
