# Tijdelijk: bekijkt vanaf een runner hoe EnergyZero antwoordt. Ronde 6: de nieuwe REST-API met
# kwartierprijzen, mét de browser-Origin voor de CORS-vraag.
name: prices-probe
on:
  push:
    branches: [claude/zonneplan-stroomkosten-zichtbaarheid-hiqcez]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for D in "$(date -u +%d-%m-%Y)" "$(date -u -d tomorrow +%d-%m-%Y)"; do
            U="https://public.api.energyzero.nl/public/v1/prices?energyType=ENERGY_TYPE_ELECTRICITY&date=$D&interval=INTERVAL_QUARTER"
            echo "=================== $U"
            curl -sS -m 20 -D - -o body.txt -H "Origin: https://abons.github.io" -H "Accept: application/json" "$U" || true
            echo "--- body ($(wc -c < body.txt) bytes):"; head -c 1200 body.txt; echo
            echo "--- sleutels / aantal:"; jq -c 'keys' body.txt 2>/dev/null; jq -r '.base | length' body.txt 2>/dev/null
            echo "--- preflight:"
            curl -sS -m 20 -D - -o /dev/null -X OPTIONS -H "Origin: https://abons.github.io" -H "Access-Control-Request-Method: GET" "$U" || true
          done
