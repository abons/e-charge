# Tijdelijk: bekijkt vanaf een runner hoe EnergyZero antwoordt. Ronde 3: de GraphQL-query met de
# juiste veldnamen, en de marktprijs naast die van Energy-Charts gelegd.
name: prices-probe
on:
  push:
    branches: [claude/zonneplan-stroomkosten-zichtbaarheid-hiqcez]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          FROM=$(date -u -d 'today 00:00' +%Y-%m-%dT%H:%M:%S.000Z)
          TILL=$(date -u -d 'tomorrow 23:59:59' +%Y-%m-%dT%H:%M:%S.999Z)
          GQL=https://api.energyzero.nl/v1/gql
          for IV in QUARTER QUARTER_HOUR FIFTEEN_MINUTES QUARTERLY HOUR; do
            echo "=================== gql intervalType=$IV"
            curl -sS -m 20 -o body.txt -w "%{http_code}\n" -H "Origin: https://abons.github.io" -H "Content-Type: application/json" \
              -d "{\"query\":\"query(\$input: EnergyMarketPricesInput!) { energyMarketPrices(input: \$input) { prices { from till energyPriceExcl energyPriceIncl } } }\",\"variables\":{\"input\":{\"from\":\"$FROM\",\"till\":\"$TILL\",\"intervalType\":\"$IV\",\"type\":\"ELECTRICITY\"}}}" "$GQL" || true
            echo "--- body ($(wc -c < body.txt) bytes):"; head -c 900 body.txt; echo
            jq -r '.data.energyMarketPrices.prices | length' body.txt 2>/dev/null || true
          done
          echo "=================== energy-charts NL vandaag (unix, EUR/MWh) eerste 8"
          curl -sS -m 20 "https://api.energy-charts.info/price?bzn=NL&start=$(date -u +%Y-%m-%d)&end=$(date -u -d tomorrow +%Y-%m-%d)" -o ec.json || true
          jq -c '[.unix_seconds[0:8], .price[0:8]]' ec.json || head -c 300 ec.json
          echo "=================== energyzero REST uur vandaag eerste 4"
          curl -sS -m 20 "https://api.energyzero.nl/v1/energyprices?fromDate=$FROM&tillDate=$TILL&interval=4&usageType=1&inclBtw=false" -o ez.json || true
          jq -c '.Prices[0:4]' ez.json || head -c 300 ez.json
