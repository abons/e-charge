# Tijdelijk: bekijkt vanaf een runner hoe EnergyZero antwoordt. Ronde 4: de enum-namen.
name: prices-probe
on:
  push:
    branches: [claude/zonneplan-stroomkosten-zichtbaarheid-hiqcez]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          FROM=$(date -u -d 'today 00:00' +%Y-%m-%dT%H:%M:%S.000Z)
          TILL=$(date -u -d 'tomorrow 23:59:59' +%Y-%m-%dT%H:%M:%S.999Z)
          GQL=https://api.energyzero.nl/v1/gql
          for IV in Hourly Quarterly Quarter QuarterHourly QuarterHour FifteenMinutes Daily; do
            echo "=================== gql intervalType=$IV"
            curl -sS -m 20 -o body.txt -w "%{http_code}\n" -H "Origin: https://abons.github.io" -H "Content-Type: application/json" \
              -d "{\"query\":\"query(\$input: EnergyMarketPricesInput!) { energyMarketPrices(input: \$input) { prices { from till energyPriceExcl energyPriceIncl } } }\",\"variables\":{\"input\":{\"from\":\"$FROM\",\"till\":\"$TILL\",\"intervalType\":\"$IV\",\"type\":\"Electricity\"}}}" "$GQL" || true
            echo "--- body ($(wc -c < body.txt) bytes):"; head -c 700 body.txt; echo
            echo "aantal: $(jq -r '.data.energyMarketPrices.prices | length' body.txt 2>/dev/null)"
          done
